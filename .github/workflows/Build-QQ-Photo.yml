name: Build QQ Photo Icon Pack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Arcticons fork
        uses: actions/checkout@v4

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Integrate the QQ photo without overwriting Arcticons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          name = 'qq_custom'
          picture = Path('qq_custom.png')
          assert picture.is_file(), 'Missing qq_custom.png at repository root'

          # Android exposes PNG files from drawable-nodpi as R.drawable.qq_custom.
          target = Path('app/src/main/res/drawable-nodpi/qq_custom.png')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(picture, target)

          # The Arcticons helper generates drawable.xml from its list of available icons.
          # Include our PNG (which is not among icons/white SVG files) in that list.
          helper = Path('preparehelper/src/main/java/com/donnnno/arcticons/helper/XMLCreator.java')
          content = helper.read_text(encoding='utf-8')
          marker = 'Set<String> newDrawables = new TreeSet<>();'
          assert marker in content, 'Arcticons changed XMLCreator.java; check upstream format'
          content = content.replace(marker, f'availableIcons.add("{name}");\n        '+marker, 1)
          helper.write_text(content, encoding='utf-8')

          # Put the photo at the beginning of the icon picker, under 'New'.
          new_icons = Path('generated/newdrawables.xml')
          index = new_icons.read_text(encoding='utf-8') if new_icons.exists() else '<resources>\n</resources>'
          tag = f'<item drawable="{name}" />'
          if tag not in index:
              if '</resources>' in index:
                  index = index.replace('</resources>', f'    {tag}\n</resources>', 1)
              else:
                  index += '\n' + tag + '\n'
          new_icons.parent.mkdir(parents=True, exist_ok=True)
          new_icons.write_text(index, encoding='utf-8')

          # Map QQ to the image, while retaining every other Arcticons mapping.
          source = Path('newicons/appfilter.xml')
          appfilter = source.read_text(encoding='utf-8')
          expression = re.compile(r'(<item\s+component="ComponentInfo\{com\.tencent\.mobileqq/[^"}]+\}"\s+drawable=")[^"]+("\s*/>)')
          appfilter, matches = expression.subn(lambda m: m.group(1) + name + m.group(2), appfilter)
          manual = '<item component="ComponentInfo{com.tencent.mobileqq/com.tencent.mobileqq.activity.SplashActivity}" drawable="qq_custom" />'
          if not matches:
              assert '</resources>' in appfilter, 'Unexpected appfilter.xml format'
              appfilter = appfilter.replace('</resources>', '    ' + manual + '\n</resources>', 1)
          source.write_text(appfilter, encoding='utf-8')

          # Use a distinct Android application ID to coexist with installed Arcticons.
          gradle = Path('app/build.gradle')
          cfg = gradle.read_text(encoding='utf-8')
          original = 'applicationId = "com.donnnno.arcticons"'
          assert original in cfg, 'Arcticons changed its application ID syntax'
          cfg = cfg.replace(original, 'applicationId = "com.personal.qqphoto.icons"', 1)
          label = 'resValue  "string", "app_name", "Arcticons"'
          assert label in cfg, 'Arcticons changed the app label definition'
          cfg = cfg.replace(label, 'resValue  "string", "app_name", "QQ Photo Icons"', 1)
          gradle.write_text(cfg, encoding='utf-8')

          print(f'Custom image: {target}')
          print(f'QQ appfilter entries updated: {matches}; one fallback mapping if none')
          print('Custom app ID: com.personal.qqphoto.icons.debug')
          PY

    
      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          if [ ! -d "${ANDROID_HOME}/platforms/android-36" ]; then
            sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          fi

      
      - name: Create debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build normal debug APK
        shell: bash
        run: |
          gradle wrapper --no-daemon
          chmod +x ./gradlew
          ./gradlew :app:assembleNormalDebug --no-daemon --stacktrace

      - name: Upload the built APK
        uses: actions/upload-artifact@v4
        with:
          name: QQ-Photo-IconPack-APK
          path: app/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error
